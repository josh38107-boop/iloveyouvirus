<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orders — Kanlungan Coffee Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.png" alt="Kanlungan Coffee Garage Logo"/>
      <div class="sidebar-logo-text">
        <h2>Kanlungan<br/>Coffee Garage</h2>
        <p>Admin Panel</p>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Overview</a>
      <a href="orders.html" class="nav-item active"><span class="nav-icon">🧾</span> Orders</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      <div class="nav-section" style="margin-top:12px">Manage</div>
      <a href="menu.html" class="nav-item"><span class="nav-icon">🍵</span> Menu</a>
      <a href="promotions.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 7v14M12 7H7.5a2.5 2.5 0 1 1 2.45-3c.5 1.5 2.05 3 2.05 3Zm0 0h4.5a2.5 2.5 0 1 0-2.45-3C13.55 5.5 12 7 12 7Z"/></svg></span> Promotions</a>
      <a href="discounts.html" class="nav-item"><span class="nav-icon">%</span> Discount Settings</a>
      <a href="payment-void-settings.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/></svg></span> Payment &amp; Void Settings</a>
      <a href="employees.html" class="nav-item"><span class="nav-icon">👥</span> Employees</a>
      <a href="inventory.html" class="nav-item"><span class="nav-icon">📦</span> Inventory</a>
      <a href="devices.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 8.5 4.75 4.75 0 0 0 7 18Z"/></svg></span> Cloud Devices</a>
    </nav>
    <div class="sidebar-footer"><span>Live</span><span class="sync-dot"></span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1>Orders</h1><div style="font-size:13px;color:var(--text-muted);">All transactions</div></div>
      <div class="topbar-right">
        <span class="topbar-time" id="topbarTime"></span>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <div class="content fade-up">
      <div class="card">
        <div class="card-header">
          <div class="card-title">Order History</div>
          <div style="display:flex;gap:10px;align-items:center;">
            <input type="text" class="input" id="searchInput" placeholder="Search orders..." style="width:200px;"/>
            <button class="btn btn-outline" onclick="loadOrders()">🔄 Refresh</button>
          </div>
        </div>
        <div id="ordersTable">
          <div class="loading"><div class="spinner"></div> Loading orders...</div>
        </div>
        <div style="display:flex;justify-content:center;gap:12px;margin-top:20px;">
          <button class="btn btn-outline" id="prevBtn" onclick="prevPage()" disabled>← Prev</button>
          <span style="color:var(--text-muted);font-size:13px;align-self:center;" id="pageInfo">Page 1</span>
          <button class="btn btn-outline" id="nextBtn" onclick="nextPage()">Next →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  requireAuth(); startClock();
  let page = 0; const PER_PAGE = 50;
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  async function loadOrders() {
    const el = document.getElementById('ordersTable');
    el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading orders...</div>';
    const orders = await api.getOrders(PER_PAGE, page * PER_PAGE);
    if (!orders?.length) {
      el.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>No orders found</p></div>';
      document.getElementById('nextBtn').disabled = true; return;
    }
    document.getElementById('nextBtn').disabled = orders.length < PER_PAGE;
    document.getElementById('prevBtn').disabled = page === 0;
    document.getElementById('pageInfo').textContent = `Page ${page + 1}`;

    el.innerHTML = `<div style="overflow-x:auto;"><table class="data-table">
      <thead><tr>
        <th>Order ID</th><th>Date & Time</th><th>Employee</th>
        <th>Type</th><th>Customer</th><th>Discount</th><th>Total</th><th>Status</th>
      </tr></thead>
      <tbody>${orders.map(o => `
        <tr>
          <td style="font-family:monospace;font-size:12px;color:var(--text-muted);">#${o.id.substring(0,12)}...</td>
          <td style="font-size:13px;">${formatDate(o.created_at)}</td>
          <td>${o.employee_name || '—'}</td>
          <td><span class="badge badge-info">${o.order_type || 'Dine-In'}</span></td>
          <td style="font-size:13px;color:var(--text-muted);">${o.customer_name || '—'}</td>
          <td style="font-size:12px;">${o.discount_cents > 0
            ? `<strong>${escapeHtml(o.discount_category || 'Discount')}</strong><br/>
               <span style="color:var(--text-muted);">${o.discount_percent == null ? '' : `${Number(o.discount_percent)}% · `}${escapeHtml(o.discount_scope || 'item')}${o.discount_reference ? `<br/>Ref: ${escapeHtml(o.discount_reference)}` : ''}</span>`
            : '—'}</td>
          <td style="font-weight:700;color:var(--accent);">${formatPeso(o.total_cents)}</td>
          <td><span class="badge ${o.status==='paid'?'badge-success':o.status==='void'?'badge-danger':'badge-warning'}">${o.status}</span></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  }

  function prevPage() { if (page > 0) { page--; loadOrders(); } }
  function nextPage() { page++; loadOrders(); }

  loadOrders();
</script>
</body>
</html>
