<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory — Kanlungan Coffee Garage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="images/logo.png" alt="Kanlungan Coffee Garage Logo"/>
      <div class="sidebar-logo-text">
        <h2>Kanlungan<br/>Coffee Garage</h2>
        <p>Admin Panel</p>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="index.html" class="nav-item"><span class="nav-icon">📊</span> Overview</a>
      <a href="orders.html" class="nav-item"><span class="nav-icon">🧾</span> Orders</a>
      <a href="reports.html" class="nav-item"><span class="nav-icon">📈</span> Reports</a>
      <div class="nav-section" style="margin-top:12px">Manage</div>
      <a href="menu.html" class="nav-item"><span class="nav-icon">🍵</span> Menu</a>
      <a href="employees.html" class="nav-item"><span class="nav-icon">👥</span> Employees</a>
      <a href="inventory.html" class="nav-item active"><span class="nav-icon">📦</span> Inventory</a>
    </nav>
    <div class="sidebar-footer"><span>Live</span><span class="sync-dot"></span></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1>Inventory</h1><div style="font-size:13px;color:var(--text-muted);">Stock levels & ingredient management</div></div>
      <div class="topbar-right">
        <span class="topbar-time" id="topbarTime"></span>
        <button class="btn-logout" onclick="logout()">Sign Out</button>
      </div>
    </div>

    <div class="content fade-up">
      <!-- Low stock alert -->
      <div id="lowStockAlert" style="display:none;margin-bottom:20px;" class="card">
        <div style="color:var(--warning);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
          <span>⚠️</span> Low Stock Alert (<span id="lowStockCount">0</span> items low)
        </div>
        <div id="lowStockList" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">All Ingredients</div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <input type="file" id="csvFileInput" accept=".csv,.xlsx,.xls" style="display:none;" onchange="handleCsvImport(event)"/>
            <button class="btn" style="background:#1a1a1a;color:#ffffff;border-radius:99px;padding:9px 20px;font-weight:600;" onclick="exportExcelCsv()">
              📊 Export Excel/CSV
            </button>
            <button class="btn btn-outline" style="border-radius:99px;" onclick="document.getElementById('csvFileInput').click()">
              📤 Import Excel/CSV
            </button>
            <button class="btn btn-primary" style="border-radius:99px;" onclick="openEditModal()">
              + Add Ingredient
            </button>
            <button class="btn btn-outline" style="border-radius:99px;" onclick="loadInventory()">
              🔄 Refresh
            </button>
          </div>
        </div>
        <div id="inventoryTable">
          <div class="loading"><div class="spinner"></div> Loading inventory...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit / Add Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Edit Ingredient</div>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <form id="editForm" onsubmit="saveIngredient(event)">
      <input type="hidden" id="ingId"/>
      <div class="form-row">
        <label>Ingredient Name</label>
        <input type="text" class="input" id="ingName" required placeholder="e.g. Espresso Beans"/>
      </div>
      <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label>Quantity On Hand</label>
          <input type="number" step="0.01" class="input" id="ingQty" required placeholder="0.00"/>
        </div>
        <div>
          <label>Unit</label>
          <input type="text" class="input" id="ingUnit" required placeholder="e.g. g, ml, pcs, oz"/>
        </div>
      </div>
      <div class="form-row">
        <label>Low Stock Threshold</label>
        <input type="number" step="0.01" class="input" id="ingThreshold" required placeholder="0.00"/>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  requireAuth(); startClock();
  let inventoryData = [];

  async function loadInventory() {
    const el = document.getElementById('inventoryTable');
    el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading...</div>';
    inventoryData = await api.getInventory();
    if (!inventoryData?.length) {
      el.innerHTML = '<div class="empty-state"><span class="icon">📦</span><p>No ingredients found</p></div>'; return;
    }

    // Low stock alert
    const lowStock = inventoryData.filter(i => i.low_stock);
    const alertEl = document.getElementById('lowStockAlert');
    if (lowStock.length > 0) {
      alertEl.style.display = 'block';
      document.getElementById('lowStockCount').textContent = lowStock.length;
      document.getElementById('lowStockList').innerHTML = lowStock.map(i =>
        `<span class="badge badge-warning">${i.name}: ${parseFloat(i.quantity_on_hand).toFixed(2)} ${i.unit}</span>`
      ).join('');
    } else {
      alertEl.style.display = 'none';
    }

    el.innerHTML = `<div style="overflow-x:auto;"><table class="data-table">
      <thead><tr>
        <th>Ingredient</th><th>Unit</th><th>On Hand</th><th>Threshold</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>${inventoryData.map(i => {
        const qty = parseFloat(i.quantity_on_hand || 0);
        const threshold = parseFloat(i.low_stock_threshold || 0);
        const pct = threshold > 0 ? Math.min((qty / threshold) * 100, 100) : 100;
        return `<tr>
          <td style="font-weight:600;color:var(--black);">${i.name}</td>
          <td style="color:var(--text-muted);">${i.unit}</td>
          <td style="font-weight:700;color:${i.low_stock?'var(--danger)':'var(--success)'};">${qty.toFixed(2)}</td>
          <td>${threshold.toFixed(2)}</td>
          <td>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="progress" style="width:90px;"><div class="progress-bar" style="width:${pct}%;background:${i.low_stock?'var(--danger)':'var(--success)'};"></div></div>
              <span class="badge ${i.low_stock?'badge-warning':'badge-success'}">${i.low_stock?'Low':'OK'}</span>
            </div>
          </td>
          <td>
            <button class="btn btn-outline" style="font-size:12px;padding:4px 10px;" onclick="openEditModal('${i.id}')">✏️ Edit</button>
          </td>
        </tr>`;
      }).join('')}
      </tbody></table></div>`;
  }

  // Modal open/close
  function openEditModal(id = null) {
    const modal = document.getElementById('editModal');
    if (id) {
      const item = inventoryData.find(i => i.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = 'Edit Ingredient';
      document.getElementById('ingId').value = item.id;
      document.getElementById('ingName').value = item.name;
      document.getElementById('ingQty').value = parseFloat(item.quantity_on_hand || 0);
      document.getElementById('ingUnit').value = item.unit;
      document.getElementById('ingThreshold').value = parseFloat(item.low_stock_threshold || 0);
    } else {
      document.getElementById('modalTitle').textContent = 'Add Ingredient';
      document.getElementById('editForm').reset();
      document.getElementById('ingId').value = '';
    }
    modal.classList.add('active');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
  }

  // Save Ingredient
  async function saveIngredient(e) {
    e.preventDefault();
    const id = document.getElementById('ingId').value || ('ing-' + document.getElementById('ingName').value.toLowerCase().replace(/[^a-z0-9]+/g, '-'));
    const payload = {
      id: id,
      name: document.getElementById('ingName').value.trim(),
      quantity_on_hand: parseFloat(document.getElementById('ingQty').value),
      unit: document.getElementById('ingUnit').value.trim(),
      low_stock_threshold: parseFloat(document.getElementById('ingThreshold').value),
      takeout_only: false
    };
    try {
      await api.upsertIngredient(payload);
      closeEditModal();
      loadInventory();
    } catch (err) {
      alert('Error saving ingredient: ' + err.message);
    }
  }

  // Export Excel / CSV
  function exportExcelCsv() {
    if (!inventoryData.length) return alert('No data to export');
    const headers = ['ID', 'Name', 'Unit', 'Quantity On Hand', 'Low Stock Threshold', 'Takeout Only'];
    const rows = inventoryData.map(i => [
      `"${i.id}"`,
      `"${i.name.replace(/"/g, '""')}"`,
      `"${i.unit}"`,
      i.quantity_on_hand,
      i.low_stock_threshold,
      i.takeout_only || false
    ]);
    // UTF-8 BOM prefix (\uFEFF) ensures Excel displays characters properly
    const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', `kanlungan_inventory_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // Import CSV
  async function handleCsvImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(evt) {
      try {
        const text = evt.target.result;
        const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length < 2) return alert('CSV file is empty or missing headers');

        const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
        const nameIdx = headers.findIndex(h => h.includes('name'));
        const qtyIdx = headers.findIndex(h => h.includes('quantity') || h.includes('on hand') || h.includes('qty'));
        const unitIdx = headers.findIndex(h => h.includes('unit'));
        const threshIdx = headers.findIndex(h => h.includes('threshold') || h.includes('low'));
        const idIdx = headers.findIndex(h => h === 'id');

        if (nameIdx === -1 || qtyIdx === -1) {
          return alert('CSV must include "Name" and "Quantity On Hand" columns.');
        }

        let imported = 0;
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
          if (!cols[nameIdx]) continue;

          const name = cols[nameIdx];
          const id = (idIdx !== -1 && cols[idIdx]) ? cols[idIdx] : ('ing-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'));
          const qty = parseFloat(cols[qtyIdx]) || 0;
          const unit = (unitIdx !== -1 && cols[unitIdx]) ? cols[unitIdx] : 'pcs';
          const threshold = (threshIdx !== -1 && cols[threshIdx]) ? parseFloat(cols[threshIdx]) : 0;

          await api.upsertIngredient({
            id: id,
            name: name,
            quantity_on_hand: qty,
            unit: unit,
            low_stock_threshold: threshold,
            takeout_only: false
          });
          imported++;
        }

        alert(`Successfully imported ${imported} ingredients!`);
        loadInventory();
      } catch (err) {
        alert('Error parsing CSV: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  loadInventory();
</script>
</body>
</html>
