services:
  - type: web
    name: kape-pos
    runtime: node
    plan: standard
    buildCommand: cd backend && npm ci
    preDeployCommand: cd backend && npm run migrate
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_PEPPER
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEFAULT_BRANCH_ID
        value: main
      - key: LEGACY_SYNC_ENABLED
        value: "true"
      - key: API_KEY
        sync: false
